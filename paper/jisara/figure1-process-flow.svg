<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Verdana, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>

  <!-- Step 1: Scenario -->
  <rect x="330" y="10" width="240" height="46" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">1. Scenario</text>
  <text x="450" y="46" text-anchor="middle" font-size="11" fill="#444444">User task + toolset (incl. one forbidden tool)</text>

  <line x1="450" y1="56" x2="450" y2="84" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loop box -->
  <rect x="60" y="84" width="780" height="420" rx="10" fill="#fafafa" stroke="#888888" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="80" y="104" font-size="11" font-weight="bold" fill="#666666">Repeats for up to 4 turns</text>

  <!-- Step 2: Model picks a tool -->
  <rect x="330" y="116" width="240" height="46" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">2. Model picks a tool</text>
  <text x="450" y="152" text-anchor="middle" font-size="11" fill="#444444">Runs locally via Ollama</text>

  <line x1="450" y1="162" x2="450" y2="190" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Mock tool server -->
  <rect x="330" y="192" width="240" height="52" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">3. Mock tool server answers</text>
  <text x="450" y="228" text-anchor="middle" font-size="11" fill="#444444">Clean text, or the same text</text>
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="#444444">with the attack hidden inside</text>

  <line x1="450" y1="244" x2="450" y2="272" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Defense -->
  <rect x="330" y="274" width="240" height="52" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">4. Defense filters the answer</text>
  <text x="450" y="310" text-anchor="middle" font-size="11" fill="#444444">None / XML tags / system message /</text>
  <text x="450" y="322" text-anchor="middle" font-size="11" fill="#444444">dual-prompt screening</text>

  <line x1="450" y1="326" x2="450" y2="354" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Decision diamond -->
  <polygon points="450,356 530,404 450,452 370,404" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">5. Model's</text>
  <text x="450" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">next move</text>

  <!-- loop-back edge: calls another tool -->
  <path d="M 530,404 C 700,404 700,140 570,140" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="270" font-size="11" fill="#555555" transform="rotate(90 700 270)" text-anchor="middle">calls another tool</text>

  <!-- three outcome arrows -->
  <line x1="410" y1="440" x2="230" y2="480" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="452" x2="450" y2="480" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="440" x2="670" y2="480" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Outcome boxes -->
  <rect x="110" y="482" width="200" height="16" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="210" y="494" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111111">Hijacked</text>

  <rect x="350" y="482" width="200" height="16" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="450" y="494" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111111">Completed the real task</text>

  <rect x="590" y="482" width="200" height="16" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="690" y="494" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111111">Refused</text>

  <line x1="210" y1="498" x2="450" y2="526" stroke="#333333" stroke-width="1.5"/>
  <line x1="690" y1="498" x2="450" y2="526" stroke="#333333" stroke-width="1.5"/>
  <line x1="450" y1="498" x2="450" y2="526" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Save and score -->
  <rect x="290" y="528" width="320" height="52" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="548" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">6. Save and score</text>
  <text x="450" y="564" text-anchor="middle" font-size="11" fill="#444444">Logged as JSON; scored into ASR,</text>
  <text x="450" y="576" text-anchor="middle" font-size="11" fill="#444444">Benign Accuracy, and Refusal Rate</text>
</svg>
