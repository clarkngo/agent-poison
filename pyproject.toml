[project]
name = "agent-poison"
version = "0.1.0"
description = "Empirical benchmarking harness for indirect prompt injection resilience in tool-calling LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Clark Ngo" }]

dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tabulate>=0.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
agent-poison = "agent_poison.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_poison"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
